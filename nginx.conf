server {
    listen 80;
    server_name localhost;

    # Složka, kde Nginx hledá statické soubory
    root /usr/share/nginx/html;
    index index.html;

    # Standardní nastavení pro React Router (pokud by aplikace využívala více podstránek)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy na Node.js backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Zapnutí Gzip komprese pro urychlení načítání statických souborů
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
