server {
    listen 80;
    server_name localhost;

    # Složka, kde Nginx hledá statické soubory
    root /usr/share/nginx/html;
    index index.html;

    # Standardní nastavení pro React Router (pokud by aplikace využívala více podstránek)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy pravidlo pro vyřešení CORS při získávání dat z RSS kanálu HZS ČR
    location /api/hzs/ {
        # Přidání veřejného DNS resolveru, aby Nginx nespadl při startu, pokud se nestihne vyhodnotit doména
        resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
        set $upstream_hzs https://www.hzspa.cz;

        # Přepíšeme URL: z "/api/hzs/vyjezdy.php" se stane jen "/vyjezdy.php"
        rewrite ^/api/hzs/(.*) /$1 break;
        
        # Přesměrujeme požadavek na reálný server HZS (pomocí proměnné, aby se vyhlo 'host not found' chybě)
        proxy_pass $upstream_hzs;
        
        proxy_set_header Host www.hzspa.cz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Zapnutí Gzip komprese pro urychlení načítání statických souborů
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
