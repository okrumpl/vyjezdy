<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HZS Výjezdy Dashboard</title>
    <meta name="description" content="Přehled aktuálních výjezdů Hasičského záchranného sboru ČR – live data, mapa, statistiky." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA meta tagy -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HZS Výjezdy" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ikony pro iOS -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Barva témy pro Android Chrome / iOS Safari -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="msapplication-navbutton-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#0b0f19" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Fonty -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph (sdílení) -->
    <meta property="og:title" content="HZS ČR – Přehled výjezdů" />
    <meta property="og:description" content="Live přehled výjezdů Hasičského záchranného sboru Pardubického kraje" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registrace Service Worker pro PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW zaregistrován:', reg.scope))
            .catch(err => console.warn('SW registrace selhala:', err));
        });
      }
    </script>
  </body>
</html>
